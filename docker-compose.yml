services:
  db:
    image: mysql:8.0
    container_name: society-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: societyWeb
    ports:
      - "3307:3306"
    volumes:
      - society_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  society_mysql_data:
